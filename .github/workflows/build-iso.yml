name: Build CodeOS ISO

on:
  workflow_dispatch:
    inputs:
      use_backports:
        description: "최신 커널/펌웨어(backports) 사용 — 신형 노트북 Wi-Fi 용. 처음엔 체크하지 마세요."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      USE_BACKPORTS: ${{ inputs.use_backports && '1' || '0' }}
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      - name: 프로젝트 압축 풀기
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "::error::저장소 최상위에 codeos.zip 이 없습니다. zip 파일을 그대로 업로드하세요."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/unz" && unzip -q "$ZIP" -d "$RUNNER_TEMP/unz"
          CFG=$(find "$RUNNER_TEMP/unz" -maxdepth 3 -path '*/auto/config' | head -n1)
          if [ -z "$CFG" ]; then echo "::error::zip 안에서 auto/config 를 찾지 못했습니다."; exit 1; fi
          echo "PROJ=$(dirname "$(dirname "$CFG")")" >> "$GITHUB_ENV"

      - name: ISO 빌드 및 업로드 (60~120분)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash "$PROJ/ci/run-ci.sh"

      - name: 전체 빌드 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          if-no-files-found: ignore
